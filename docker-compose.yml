services:
  orderDB:
    image: postgres:latest
    container_name: service-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: orderDB
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  catalogDB:
    image: postgres:latest
    container_name: catalog-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: catalogDB
    ports:
      - "5433:5432"
    volumes:
      - pgdata2:/var/lib/postgresql

  analyticsDB:
    image: postgres:latest
    container_name: analytics-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: analyticsDB
    ports:
     - "5435:5432"
    volumes:
      - pgdata3:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
  pgdata2:
  pgdata3: