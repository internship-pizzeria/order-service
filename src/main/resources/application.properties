spring.config.import=optional:file:.env[.properties]
spring.sql.init.mode=always
spring.application.name=order-service
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG

catalog-service.url=${catalog-service.url}

spring.jackson.time-zone=UTC

order.timeout.minutes=15

# Analytics datasource (JdbcTemplate, not JPA)
analytics.datasource.url=${ANALYTICS_DATABASE_URL}
analytics.datasource.username=${ANALYTICS_DATABASE_USER}
analytics.datasource.password=${ANALYTICS_DATABASE_PASSWORD}
analytics.datasource.driver-class-name=org.postgresql.Driver


# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}